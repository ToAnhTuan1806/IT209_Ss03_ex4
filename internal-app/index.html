<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal App - Cổng Thông Tin Nội Bộ (Port 8090)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #064e3b 0%, #0f172a 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }
        .badge {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
        h1 { font-size: 28px; margin-bottom: 12px; color: #ecfdf5; }
        p { color: #94a3b8; line-height: 1.6; font-size: 15px; margin-bottom: 24px; }
        .port-info {
            background: #022c22;
            border: 1px solid #065f46;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            color: #34d399;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">🔒 Intranet Portal</span>
        <h1>Internal Application</h1>
        <p>Hệ thống cổng thông tin nội bộ doanh nghiệp dành riêng cho nhân viên và quản trị viên.</p>
        <div class="port-info">Listening Port: 8090 (TCP) &bull; Root: /var/www/internal-app/html</div>
    </div>
</body>
</html>
